[project]
name = "it-platform-backend"
version = "0.1.0"
description = "Backend платформы управления IT-инфраструктурой медицинской организации"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "alembic/versions",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
# Базовый набор на старте: ошибки, стиль pycodestyle, неиспользуемые импорты,
# сортировка импортов. Ужесточим по мере роста проекта.
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # длину строки уже контролирует line-length, дублировать незачем
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
# Базовый режим: не строгий, чтобы не блокировать команду из 2 человек
# на старте лишними аннотациями. Ужесточение — отдельной задачей позже.
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
exclude = [
    "alembic/versions/",
    "tests/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]